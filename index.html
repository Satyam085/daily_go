<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAS Automation Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="app">
    <header class="hero compact">
      <h1>DAS <span class="accent">Auto</span></h1>
    </header>

    <section class="panel">
      <h2>Add / Update Feeder Entry</h2>
      <div class="pill-wrap">
        <p class="pill-label">Subdivision</p>
        <div id="subdivisionTabs" class="pills substation-tabs" role="tablist" aria-label="Subdivisions"></div>
      </div>

      <div class="pill-wrap">
        <p class="pill-label">Substation</p>
        <div id="substationTabs" class="pills substation-tabs" role="tablist" aria-label="Substations"></div>
      </div>

      <div class="pill-wrap">
        <p class="pill-label">Feeder</p>
        <div id="feederPills" class="pills"></div>
      </div>

      <div class="grid two meta">
        <label>
          Activity Date
          <input id="activityDate" type="date">
        </label>
        <label>
          Feeder + Category
          <input id="selectedFeeder" type="text" readonly>
        </label>
      </div>

      <details open>
        <summary>TT</summary>
        <div class="grid two">
          <label>
            TT Number
            <input id="tt" type="number" min="0" step="1" placeholder="0">
          </label>
          <label>
            TT Reason
            <input id="ttReason" type="text" placeholder="Wind / other reason">
          </label>
        </div>
      </details>

      <details>
        <summary>SF</summary>
        <div id="sfList" class="entry-list"></div>
        <button id="addSfBtn" type="button" class="ghost" style="margin-top: 0.5rem; width: 100%;">+ Add SF</button>
      </details>

      <details>
        <summary>ESD</summary>
        <div id="esdList" class="entry-list"></div>
        <button id="addEsdBtn" type="button" class="ghost" style="margin-top: 0.5rem; width: 100%;">+ Add ESD</button>
      </details>

      <details>
        <summary>PSD</summary>
        <div class="grid two">
          <label>
            PSD Start
            <input id="psdStart" type="time">
          </label>
          <label>
            PSD End
            <input id="psdEnd" type="time">
          </label>
        </div>
        <label>
          PSD Reason
          <input id="psdReason" type="text" placeholder="Reason">
        </label>
      </details>

      <div class="actions">
        <button id="runAutoBtn" class="primary">Run Automatically</button>
        <button id="generateBtn" class="ghost">Generate Script</button>
        <button id="clearBtn" class="danger-link">Clear all entries</button>
      </div>
      <p id="generateStatus" class="entry-meta" role="status"></p>
    </section>

    <dialog id="warningDialog" class="warning-modal" closedby="any" aria-labelledby="warningTitle">
      <h2 id="warningTitle">Warning: Long Duration</h2>
      <p style="font-size:0.85rem;margin:0;">The following entries have SF or ESD duration exceeding 2 hours:</p>
      <ul id="warningList"></ul>
      <form method="dialog" class="warning-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary">Continue Anyway</button>
      </form>
    </dialog>

    <dialog id="summaryDialog" class="summary-modal" closedby="any" aria-labelledby="summaryTitle">
      <h2 id="summaryTitle">Review Before Submitting</h2>
      <div id="summaryContent"></div>
      <form method="dialog" class="summary-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary">Confirm & Submit</button>
      </form>
    </dialog>
  </main>

  <footer style="text-align:center;padding:1.5rem 0 2rem;font-size:0.75rem;color:var(--muted,#888);">Made by Satyam</footer>

  <script type="module" src="app.js"></script>
</body>

</html>
